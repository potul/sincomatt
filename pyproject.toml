[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audiotrain"
version = "1.0.0"
description = "Modular PyTorch AI Neural Amplifier Trainer for AM3, AM4, IR, and NAM Distillation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "soundfile>=0.12.0",
    "pyyaml>=6.0",
]

[project.scripts]
audiotrain = "audiotrain.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["audiotrain*"]

[tool.setuptools.package-data]
audiotrain = [
    "assets/*.wav",
    "configs/*.yaml",
]
